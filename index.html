<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сайт на реставрации</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
    padding: 32px 20px;
  }

  .wrap {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
  }

  p {
    font-size: clamp(0.95rem, 2.5vw, 1.05rem);
    line-height: 1.6;
    color: #666;
    margin-bottom: 8px;
  }

  .contacts {
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid #e5e5e5;
    font-size: 0.9rem;
    color: #888;
  }

  .contacts a {
    color: #1a1a1a;
    text-decoration: none;
    border-bottom: 1px solid #ccc;
    transition: border-color 0.2s;
  }

  .contacts a:hover {
    border-color: #1a1a1a;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Сайт на реставрации</h1>
    <p>Мы обновляем сайт и скоро вернёмся.</p>
    <p>Приносим извинения за неудобства.</p>

    <div class="contacts">
      По вопросам: <a href="mailto:futuraos.off@gmail.com">futuraos.off@gmail.com</a>
    </div>
  </div>
</body>
</html>
